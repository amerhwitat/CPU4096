name: CPU4096 Java Register Contracts

on:
  push:
    branches: [main]
    paths: ["java/**", "contracts/fixtures/**", ".github/workflows/java-register-contracts.yml"]
  pull_request:
    paths: ["java/**", "contracts/fixtures/**", ".github/workflows/java-register-contracts.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-register-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/pom.xml
      - name: Verify register model against shared vectors
        run: mvn --batch-mode --no-transfer-progress clean verify
